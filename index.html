let currentIndex = 0;

// 🌸 画面描画処理（HTML要素を正しく操作する魔法）
function renderScene() {
    const currentScene = story[currentIndex];
    const textElem = document.getElementById("advText");
    const choicesArea = document.getElementById("choicesArea");
    const nextHint = document.getElementById("nextHint");

    if (!textElem) return;

    // 1. セリフテキストの更新
    textElem.textContent = currentScene.text;

    // 2. 選択肢エリアのリセット
    if (choicesArea) {
        choicesArea.innerHTML = "";
    }

    // 3. 選択肢がある場合の描画
    if (currentScene.options && currentScene.options.length > 0) {
        if (nextHint) nextHint.style.display = "none"; // ▼ を隠す

        currentScene.options.forEach(option => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.textContent = option.label;
            
            btn.onclick = (e) => {
                e.stopPropagation(); // BOX全体のクリックとバッティングするのを防ぐ
                jumpTo(option.next);
            };
            
            if (choicesArea) choicesArea.appendChild(btn);
        });
    } else {
        if (nextHint) nextHint.style.display = "block"; // ▼ を表示
    }
}

// 🌸 指定インデックスへのジャンプ処理
function jumpTo(targetIndex) {
    if (targetIndex < story.length) {
        currentIndex = targetIndex;
        renderScene();
        } else {
        // 🌸 閉じる魔法効果音（magic23.mp3）を再生！
        const magicSE = document.getElementById('magic');
        if (magicSE) {
            magicSE.currentTime = 0; // 頭出し
            magicSE.play().catch(e => console.log("Audio play blocked:", e));
        }

        // 🌸 音が心地よく聞こえるタイミング（0.3秒後）でウィンドウを閉じる！
        setTimeout(function() {
            window.close();
        }, 1300);
    }
}

// 🌸 メッセージBOXクリック時の進行処理（onclick="progressText()" または handleBoxClick 用）
function progressText() {
    const currentScene = story[currentIndex];

    // 選択肢が出ている最中はBOXクリックでの進行をストップ
    if (currentScene.options && currentScene.options.length > 0) {
        return;
    }

    // next の指定があればそこへジャンプ、無ければ次の番号 (+1) へ進む
    if (typeof currentScene.next === "number") {
        jumpTo(currentScene.next);
    } else {
        jumpTo(currentIndex + 1);
    }
}

// HTML側の onclick="progressText()" に対応させるため関数名を統一
window.progressText = progressText;

// 初期描画を実行
document.addEventListener("DOMContentLoaded", () => {
    renderScene();
});

/* ✨ 効果音魔法（クリック音） ✨ */
function playClickSE() {
    const clickSound = document.getElementById('click-sound');
    if (clickSound) {
        clickSound.currentTime = 0; // 連打しても頭から鳴るようにリセット
        clickSound.play().catch(e => console.log("Audio play blocked:", e));
    }
}
